name: Spelling

on:
  # "production" was watched here, and there is no such branch on the remote,
  # so this only ever ran on pull requests and had no status on any branch.
  push:
    branches:
    - master
    - main
    - development
  pull_request: null
  workflow_dispatch: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos_check:
    name: Typos
    runs-on: ubuntu-latest
    if: ${{ github.triggering_actor != 'dependabot[bot]' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Check spelling
      uses: crate-ci/typos@v1.32.0
