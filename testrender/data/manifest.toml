[fixtures.flex-align-items]
compare = ["pages", "text", "ssim"]
notes = """Every align-items value on a row 60pt tall holding items of unequal \
content height: stretch, flex-start, flex-end, center, and baseline with a \
larger font, a smaller one and a padded item, which all line up on their first \
