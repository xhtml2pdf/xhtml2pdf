[fixtures.flex-align-content]
compare = ["pages", "text", "ssim"]
notes = """Every align-content value on a wrapping container 66pt tall whose \
two lines leave free space in the cross axis: flex-start, center, flex-end, \
space-between, space-around, space-evenly and stretch. The height is a length, \
which is what makes the container's cross size definite; align-content does \
nothing without one. Every value places its lines where the browser does; \
the SSIM is where a page this dense in box edges lands, next to \
css-border-style at 0.85, each edge being a high-contrast line that the \
