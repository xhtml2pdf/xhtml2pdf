[fixtures.flex-in-table-cell]
compare = ["pages", "text", "ssim"]
notes = """A flex container inside a table cell, which is the one place the \
container's width is not simply its frame's: a single-line row of flex: 1 1 0 \
items, a wrapping row whose lines have to come out of the cell's width, and \
the same row with a height and align-content. Measuring a table's columns \
probes each cell more than once before the final pass wraps anything, so a \
container here is asked its size at more than one width."""

[fixtures.font-fallback]
compare = ["pages", "text", "ssim"]
notes = """A font-family list of three embedded families, matched per \
character as CSS says: the first covers Latin and Czech only, the second adds \
Cyrillic and Greek, the third adds Hebrew. Every family is a file both engines \
load, so the two make the same decision character by character and the \
comparison is about the matching rather than about what a system font happens \
to hold."""

[fixtures.rtl-table]
compare = ["pages", "ssim"]
notes = """A dir="rtl" document: paragraphs aligned to the right unless they \
say otherwise, Latin words keeping their own direction inside Hebrew ones, and \
a table whose columns run from the right, so the first <td> of a row is its \
rightmost cell. Hebrew rather than Arabic because it is not cursive -- \
ReportLab does no shaping, so an Arabic fixture would be comparing xhtml2pdf's \
unjoined letters against the browser's joined ones and measuring that instead. \
The text is not compared: pypdf runs its own bidirectional pass over what it \
extracts, so it answers in logical order and says nothing about what was \
drawn."""

[fixtures.css-border-radius-background]
compare = ["pages", "text", "ssim"]
notes = """border-radius on blocks, the fill and the image: one to four values, \
the / elliptical form, percentages of the box, 999px scaled down to a pill \
(css-backgrounds-3 5.5), em, the corner longhands, and a tiled \
background-image clipped to the curve."""

[fixtures.css-border-radius-borders]
compare = ["pages", "text", "ssim"]
notes = """Rounded borders on blocks: uniform solid, dashed, dotted and double \
as one closed path; per-side colours and widths as one path per side, \
meeting halfway round each corner; a missing side. xhtml2pdf centres the \
stroke on the edge of the box, as it does for straight borders, so the ring \
sits half its width further out than the browser's."""

[fixtures.flex-border-radius]
compare = ["pages", "text", "ssim"]
notes = """border-radius on flex items and on the container around them: \
radius alone, a bordered 12pt 0, a dashed 50%. The card is a column flex \
box, the way to draw a rounded box around blocks until a plain div wrapping \
blocks has a box of its own; its tag is a pill."""

