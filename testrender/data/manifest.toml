[fixtures.inline-box-pagebreak]
compare = ["pages"]
notes = """A padded, bordered span of a page and a half: the box is open at \
the bottom of page 1 and carries on, without a left edge, at the top of page 2. \
line-height is pinned so both engines fit about the same number of lines on a \
