[fixtures.flex-cut-item]
compare = ["pages"]
notes = """A fixed sidebar card beside two columns of prose, together taller than \
a page: the row is cut where the page ends, each column goes on at the top of \
page 2 with its box open at the cut, and the sidebar, done on page 1, holds its \
