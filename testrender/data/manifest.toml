stacks from the bottom. The boxes land in the same places in both engines; the \
text score is 0.77 because the two write the reversed lines to the PDF in \
different orders. The browser writes them in painted order, so a reversed row \
extracts as "third second first"; xhtml2pdf writes them in source order, which \
is the reading order flexbox 5.3 asks for -- reversing is a visual reordering \
only, and a reader or a copy-paste should still get the document's order."""

[fixtures.flex-wrap]
compare = ["pages", "text", "ssim"]
notes = """The three flex-wrap values on the same six items of 110pt: nowrap \
shrinks them onto one line, wrap breaks them onto two, and wrap-reverse puts \
the first line at the bottom, which also turns align-items: flex-start into \
the bottom edge. The text score is the same painted-order difference \
flex-direction records: the browser writes a wrap-reverse container's lines \
bottom line first, xhtml2pdf writes them in source order. The lines \
themselves land where the browser puts them, checked side by side."""

[fixtures.flex-gap]
compare = ["pages", "text", "ssim"]
notes = """gap and its two longhands: the shorthand's row-then-column order, \
row-gap and column-gap each on their own, percentage gaps, and row-gap in a \
column container, where it is the main-axis gap rather than the cross one. The SSIM is box-edge \
density, as for flex-align-content."""

[fixtures.flex-grow-shrink]
compare = ["pages", "text", "ssim"]
notes = """flex-grow 0/1/2/3 sharing free space, flex-shrink 0/1/2 giving back \
