[fixtures.inline-block-nested]
compare = ["pages", "text", "ssim"]
notes = """A flex row inside an inline-block, which is how xhtml2pdf writes \
inline-flex: the container always takes the full width of the box it is in. \
The items are spans on purpose. A <div> inside a <p> is not allowed, and the \
HTML parser lifts it out of every inline element around it before any CSS is \
applied, which leaves the flex container empty -- in a browser exactly as \
here, so the fixture went on agreeing while testing nothing."""

[fixtures.inline-box]
compare = ["pages", "text", "ssim"]
notes = """display: inline with a box of its own: spans with padding, border \
and background inside a line, one with side margins, one nested in another, and \
