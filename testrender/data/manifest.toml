items to the ends, and a row that overflows: flex-shrink 2 vs 0 with min-width: 0 \
so the automatic minimum does not stop the shrinking. Known difference: \
xhtml2pdf's max-content of a paragraph carries a 1pt allowance."""

[fixtures.flex-pagebreak]
compare = ["pages"]
notes = """Forty wrapped tiles of 60pt, more than a page: the container is cut \
at the page edge, slicing the tile the cut falls in (its one-line text stays \
above the cut, its box goes on below). Only the page count is compared: where \
each cut falls depends on the engine's page box and line metrics, so neither \
the rasterised pages nor the per-page text line up, though the document's \
text as a whole does (text_doc is recorded at 1.0)."""

[fixtures.inline-block-badges]
compare = ["pages", "text", "ssim"]
notes = """display: inline-block inside paragraphs: badges with padding and a \
