<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>img-border-radius</title>
<style type="text/css">
body { font-family: Helvetica; font-size: 10pt; line-height: 15pt; }
p { margin: 0 0 12pt 0; }
.avatar { width: 90pt; height: 90pt; border-radius: 50%; }
.oval { width: 150pt; height: 100pt; border-radius: 50%; }
.soft { width: 150pt; height: 100pt; border-radius: 16px; }
.mixed { width: 150pt; height: 100pt; border-radius: 40px 0 / 20px 0; }
.float { float: left; width: 80pt; height: 60pt; border-radius: 12px; margin-right: 8pt; }
.svg { width: 90pt; height: 90pt; border-radius: 24px; }
</style>
</head>
<body>
<p><img class="avatar" src="img/test.jpg"> <img class="oval" src="img/beach.jpg"></p>
<p><img class="soft" src="img/beach.jpg"> <img class="mixed" src="img/beach.jpg"></p>
<p><img class="float" src="img/test.jpg" align="left">A floated image with its corners rounded, and text flowing beside it. The river bends twice before it reaches the old mill, where the water slows and turns green. Every spring the orchard behind the school fills with blossom that the wind carries into town.</p>
<p><img class="svg" src="img/shapes.svg"> an SVG image clipped the same way.</p>
</body>
</html>
