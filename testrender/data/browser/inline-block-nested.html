<!--
  Browser equivalent of data/source/inline-block-nested.html

  Plain HTML/CSS on both sides, so the equivalent is the same markup with
  _normalize.css linked ahead of the document's own styles.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_normalize.css">
<title>inline-block-nested</title>
<style type="text/css">
body { font-family: Helvetica; font-size: 11pt; }
p { margin: 0 0 8pt 0; }
.chip { display: inline-block; border: 1pt solid #4e9a06; padding: 2pt; vertical-align: middle; }
.row { display: flex; gap: 6pt; }
.row span { padding: 2pt 4pt; background-color: #e8f5e0; }
</style>
</head>
<body>
<p>A flex row inside an inline-block: <span class="chip"><span class="row"><span>one</span><span>two</span><span>three</span></span></span> is how inline-flex is written for xhtml2pdf, and the rest of the sentence carries on after it.</p>
</body>
</html>
