<!--
  Browser equivalent of data/source/test-svg.html

  Already plain HTML/CSS; only the external SVG path is rewritten.

  Assets are referenced through ../source/ so both sides load byte-identical
  files. _normalize.css is linked ahead of the document's own styles; it
  replaces the browser UA stylesheet with xhtml2pdf's DEFAULT_CSS so the two
  engines start from the same defaults.
-->
<html>
<head>
<link rel="stylesheet" href="_normalize.css">
    <title>SVG images</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style type="text/css">
    body { font-family: Helvetica; }
    h2 { font-size: 1.1em; margin-top: 1em; }
    </style>
</head>
<body>
<h2>External SVG file</h2>
<img src="../source/img/shapes.svg" style="width: 120px; height: 120px;">

<h2>Inline SVG, percent-encoded data URI</h2>
<p>The RFC 2397 non-base64 form. This used to be rejected outright, because every
<code>data:</code> URI was routed to a handler that only understood <code>;base64,</code>.</p>
<img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%22100%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2240%22%20fill%3D%22%23c00%22%2F%3E%3C%2Fsvg%3E" style="width: 100px; height: 100px;">

<h2>Inline SVG, base64 data URI</h2>
<img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB4PSIxMCIgeT0iMTAiIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgZmlsbD0iIzA2NiIvPjwvc3ZnPg==" style="width: 100px; height: 100px;">
</body></html>
