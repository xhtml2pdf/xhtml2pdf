  engines start from the same defaults; see data/browser/_normalize.css.
-->
<html>
<head>
<link rel="stylesheet" href="_normalize.css">

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

        div#foo #bar-table th,
        div#bar #bar-table th {
            background-color: #F0F0F0;
        }
    </style>
</head>
<body>
<div id="foo">
    <div id="foo-header">
        <table id="foofoo">
            <tr>
                <th>One</th>
                <td>Two</td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
