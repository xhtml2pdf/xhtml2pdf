<!--
  Browser equivalent of data/source/arabic_font_rendering.html

  Arabic text with an @font-face DejaVu Sans. The font URL resolves from this
  directory, which sits at the same depth as data/source/, so it is unchanged.

  <pdf:language name="arabic"/> tells xhtml2pdf to run the text through
  arabic-reshaper and python-bidi. A browser shapes and reorders Arabic natively
  from the Unicode bidi algorithm, so the tag has no equivalent and is dropped;
  dir="rtl" expresses the same intent in HTML.

  The two shaping implementations are not expected to be glyph-identical, so
  this fixture is compared on pagination and text rather than SSIM.
-->

	}
	p.extra {

	div {

	table {
		border: 2px solid black;
	}
	h1 {
		page-break-before: always;
	}

	tr {
	background-color:red;
	}


</style>
</head>
